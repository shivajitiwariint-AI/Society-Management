# Reverse proxy for Society Management.
# Install as a site in /etc/nginx/conf.d/ (or sites-enabled, included from http{}).
# Replace example.com and TLS certificate paths before use.
# The application itself listens only on 127.0.0.1:3000.

limit_req_zone $binary_remote_addr zone=society_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=society_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=society_web:10m rate=120r/m;

server {
    listen 80;
    server_name society.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name society.example.com;

    ssl_certificate     /etc/ssl/society-management/fullchain.pem;
    ssl_certificate_key /etc/ssl/society-management/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (SRS 15.3). Adjust frame-src/style hashes only with review.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    limit_req_status 429;
    client_max_body_size 10m;
    server_tokens off;

    # No public file serving: private documents, dumps, env files, and repo paths
    # are never mapped with root/alias. All downloads go through authorized app routes.
    location ~ ^/(private-storage|backups|infrastructure|native%20host%20installation|\.env|\.git)(/|$) {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /api/v1/auth/ {
        limit_req zone=society_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/ {
        limit_req zone=society_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;  # large/asynchronous report requests
    }

    location / {
        limit_req zone=society_web burst=240 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
